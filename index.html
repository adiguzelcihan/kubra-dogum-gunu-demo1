<!doctype html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#172132"><title>KÜBRA.exe — Arayüz Testi</title><style>
:root{font-family:Arial,sans-serif;color:#f3e8d9;background:#121b29}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#253146,#101723 65%);min-height:100dvh}.shell{max-width:540px;margin:auto;padding:18px 16px 110px}.top{display:flex;justify-content:space-between;align-items:center;padding:0 4px 22px;color:#e9c99c}.brand{font:30px Georgia;letter-spacing:4px}.top span{font-size:12px;letter-spacing:1px}h1,h2,h3{font-family:Georgia;font-weight:normal;margin:0}h1{font-size:40px}h2{font-size:28px}.muted{color:#bfc1bf}.eyebrow{font-size:10px;font-weight:bold;letter-spacing:2px;color:#e9c99c;margin-bottom:10px}.hero{height:290px;display:flex;flex-direction:column;justify-content:flex-end;padding:22px;border:1px solid #766e63;border-radius:22px;background:linear-gradient(0deg,#111b2b 2%,#111b2b70 60%,#23354e66),radial-gradient(ellipse at 35% 33%,#947b6566,#26394e 56%,#151f2e);overflow:hidden}.hero h1{font-size:39px;line-height:1.05}.hero p{font-size:14px;line-height:1.6;max-width:300px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:21px 0 11px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.panel,.tile{background:#253242;border:1px solid #71695d;border-radius:17px;padding:16px}.tile{min-height:130px;display:flex;flex-direction:column;justify-content:space-between}.tile h3{font-size:24px}.small{font-size:12px;color:#cfc2ae}.btn{border:0;border-radius:13px;background:#f0cf9d;color:#2f281e;padding:11px 15px;font-weight:bold;cursor:pointer}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,540px);background:#101a28;border:1px solid #5d554d;border-radius:18px 18px 0 0;padding:7px max(8px,env(safe-area-inset-left)) calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);gap:3px;z-index:10}.nav button{border:0;background:transparent;color:#d4c6b5;font-size:11px;padding:10px 3px;border-radius:12px;cursor:pointer}.nav button.active{background:linear-gradient(120deg,#f8e3bd,#e6bb83);color:#30251c}.nav i{display:block;font-style:normal;font-size:23px;margin-bottom:6px}.chapter{width:100%;background:#253242;border:1px solid #5d5c58;border-radius:16px;padding:17px;text-align:left;color:#f0e3d1;display:flex;align-items:center;gap:15px;margin:12px 0;cursor:pointer}.chapter b{font:34px Georgia;color:#e5bd85}.chapter span{flex:1;min-width:0}.chapter strong{font:23px Georgia;display:block}.chapter small{display:block;color:#b8afaa;margin-top:8px}.chapter:disabled{opacity:.55}.subpage h1{margin:0 0 9px}.desc{font-size:14px;color:#c6b9a8;line-height:1.6}.photos{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.photobox{border:1px solid #5b5c60;border-radius:18px;overflow:hidden;background:#233448;min-height:178px;padding:0;text-align:left;color:#f0dfc5;cursor:pointer}.art{height:140px;background:linear-gradient(145deg,#47576a,#253144 60%,#a28066);display:grid;place-items:center;font-size:35px;color:#dec5a3}.photobox span{display:block;padding:12px;font:20px Georgia}.formrow{display:grid;gap:5px;margin:11px 0}.formrow label{font-size:12px;color:#ead2ab}input{background:#101a28;border:1px solid #7c756a;color:white;border-radius:9px;padding:12px;width:100%;font-size:16px}.modal{position:fixed;inset:0;background:#0c111de8;display:none;align-items:center;justify-content:center;padding:24px;z-index:30}.modal.open{display:flex}.modalcard{max-width:460px;width:100%;background:#263241;padding:24px;border:1px solid #8c7458;border-radius:20px}.modalcard h2{margin-bottom:12px}.close{float:right;background:none;border:0;color:#edd0a3;font-size:24px;cursor:pointer}.note{text-align:center;color:#cabaa6;font:italic 19px Georgia;margin:35px 0}.pill{display:inline-block;font-size:12px;color:#d9c095;border:1px solid #867058;border-radius:99px;padding:7px 9px;margin-top:8px}button{touch-action:manipulation}.hidden{display:none}
</style></head><body><div class="shell"><header class="top"><div class="brand">KÜBRA.exe</div><span>Arayüz Testi</span></header><main id="root"></main></div><nav class="nav" id="nav"><button data-tab="home" class="active"><i>⌂</i>Ana Sayfa</button><button data-tab="story"><i>♡</i>Hikâyemiz</button><button data-tab="games"><i>✦</i>Oyunlar</button><button data-tab="photos"><i>▧</i>Fotoğraflar</button></nav><div class="modal" id="modal"><div class="modalcard"><button class="close" id="close">×</button><div id="modalbody"></div></div></div><script>
const base=[{title:"İlk Merhaba",date:"2026-02-21"},{title:"Evlilik Teklifi",date:"2026-06-28"},{title:"Nişanımız",date:"2026-08-22"}];let custom=[];try{custom=JSON.parse(localStorage.getItem('kubra_demo_dates')||'[]')}catch(e){}let tab='home',sub=false;
const root=document.getElementById('root'),modal=document.getElementById('modal');function modalShow(html){document.getElementById('modalbody').innerHTML=html;modal.classList.add('open')}document.getElementById('close').onclick=()=>modal.classList.remove('open');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function diff(s){const n=new Date(s+'T12:00:00'),now=new Date(),d=Math.round((n-now)/86400000);return d>0?d+' gün kaldı':d<0?Math.abs(d)+' gün önce':'Bugün'}
function daylist(){return [...base,...custom].map((x,i)=>'<button class="chapter" data-day="'+i+'"><b>♡</b><span><strong>'+esc(x.title)+'</strong><small>'+esc(x.date)+' · '+diff(x.date)+'</small></span><b style="font:25px Georgia">›</b></button>').join('')}
function bindDays(){root.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{const i=+b.dataset.day,v=[...base,...custom][i];modalShow('<h2>'+esc(v.title)+'</h2><p class="desc">'+esc(v.date)+' · '+diff(v.date)+'</p>'+ (i>=base.length?'<button class="btn" id="removeDay">Bu demo kaydını sil</button>':'<p class="desc">Örnek etkinlik</p>'));let del=document.getElementById('removeDay');if(del)del.onclick=()=>{custom.splice(i-base.length,1);localStorage.setItem('kubra_demo_dates',JSON.stringify(custom));modal.classList.remove('open');draw()}})}
function draw(){document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));window.scrollTo(0,0);
if(tab==='home'){root.innerHTML='<section class="hero"><div class="eyebrow">BİZİM HİKÂYEMİZ</div><h1>Birlikte, her şey daha güzel.</h1><p>Anılar, hayaller ve daha yazılacak güzel sayfalar...</p></section><div class="row"><h2>Özel Günlerimiz</h2><button class="btn" id="all" style="font-size:12px">Tümünü Gör ↗</button></div><div class="grid">'+[...base,...custom].slice(0,2).map((x,i)=>'<div class="tile"><div>♡</div><div><div class="small">'+esc(x.date)+'</div><h3>'+esc(x.title)+'</h3><div class="small">'+diff(x.date)+'</div></div></div>').join('')+'</div><p class="note">Daha yazılacak çok güzel sayfamız var. ♡</p><p class="small" style="text-align:center">GÜVENLİ DEMO — GERÇEK FOTOĞRAF VE VİDEO İÇERMEZ</p>';document.getElementById('all').onclick=()=>{sub='days';draw()}}
else if(sub==='days'){root.innerHTML='<div class="subpage"><button class="btn" id="back">← Ana Sayfa</button><p class="eyebrow" style="margin-top:25px">BİZİM TAKVİMİMİZ</p><h1>Özel Günlerimiz</h1><p class="desc">Örnek günler ve kendi ekleyeceğin test kayıtları.</p>'+daylist()+'<button class="btn" id="add">+ Yeni Özel Gün Ekle</button></div>';document.getElementById('back').onclick=()=>{sub=false;draw()};document.getElementById('add').onclick=()=>{modalShow('<h2>Yeni Özel Gün</h2><form id="dayform"><div class="formrow"><label>Başlık</label><input id="daytitle" required maxlength="45"></div><div class="formrow"><label>Tarih</label><input id="daydate" type="date" required></div><button class="btn" type="submit">Kaydet</button></form>');document.getElementById('dayform').onsubmit=e=>{e.preventDefault();custom.push({title:document.getElementById('daytitle').value,date:document.getElementById('daydate').value});localStorage.setItem('kubra_demo_dates',JSON.stringify(custom));modal.classList.remove('open');draw()}};bindDays()}
else if(tab==='story'){const arr=[['01','Her Şey Böyle Başladı','21 Şubat 2026'],['02','Bir Soru, Bir Ömür','28 Haziran 2026'],['03','Nişanımız','22 Ağustos 2026'],['04','Düğünümüz','Yakında']];root.innerHTML='<div class="eyebrow">HİKÂYEMİZ</div><h1>Bölümler</h1><p class="desc">Dört bölümün tamamı tek sayfada.</p>'+arr.map((x,i)=>'<button class="chapter" data-chapter="'+i+'" '+(i===3?'disabled':'')+'><b>'+x[0]+'</b><span><small>'+x[2]+'</small><strong>'+x[1]+'</strong><small>'+(i===3?'Yakında':'Demoyu aç ›')+'</small></span></button>').join('');root.querySelectorAll('[data-chapter]').forEach(b=>b.onclick=()=>modalShow('<div class="eyebrow">ARAYÜZ TESTİ</div><h2>'+arr[+b.dataset.chapter][1]+'</h2><p class="desc">Bu halka açık test sürümünde gerçek hikâye görselleri, mesajlar ve videolar yoktur. Navigasyon çalışıyor.</p>'))}
else if(tab==='photos'){root.innerHTML='<div class="eyebrow">ALBÜMLER</div><h1>Fotoğraflarımız</h1><p class="desc">Bu demo kişisel fotoğraf içermez.</p><div class="photos">'+['İlk Mesaj','Evlilik Teklifi','Nişanımız','Düğünümüz'].map((x,i)=>'<button class="photobox" data-photo="'+i+'"><div class="art">'+['✉','♡','✧','◇'][i]+'</div><span>'+x+'</span></button>').join('')+'</div>';root.querySelectorAll('[data-photo]').forEach(b=>b.onclick=()=>modalShow('<h2>Örnek albüm</h2><p class="desc">Gerçek fotoğraflar sadece özel sürümde bulunacak.</p>'))}
else{root.innerHTML='<div class="eyebrow">OYUNLAR</div><h1>Oyun Zamanı</h1><p class="desc">Mobil arayüz testini bu ekrandan da yapabilirsin.</p><div class="panel"><h2>Beni Ne Kadar Tanıyorsun?</h2><p class="desc">Eğlenceli sorular yakında.</p><span class="pill">Hazırlanıyor</span></div>'}
}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;sub=false;draw()});draw();
</script></body></html>
